<div id="auth-modal" class="wa-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title"
    hx-swap-oob="true">
    <div class="wa-modal__backdrop" aria-hidden="true"></div>
    <div class="wa-modal__panel"
        @click.away="document.getElementById('auth-modal').outerHTML = '<div id=\'auth-modal\'></div>'" x-data="{
            email: '',
            isLoading: false,
            sent: false,
            error: '',
            async submit() {
                if (!this.email) return;
                this.isLoading = true;
                this.error = '';
                try {
                    // Use server-provided next_url (which includes action params) or fallback to current page
                    const nextUrl = '{{ next_url|default("") }}' || window.location.href;

                    const res = await fetch('/api/auth/magic-link', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: this.email, next_url: nextUrl })
                    });
                    if (res.ok) {
                        this.sent = true;
                    } else {
                        const data = await res.json();
                        this.error = data.detail || 'Failed to send link';
                    }
                } catch (e) {
                    this.error = 'Network error occurred';
                } finally {
                    this.isLoading = false;
                }
            }
        }">

        <!-- Initial Form State -->
        <div x-show="!sent">
            <h3 class="wa-modal__title" id="auth-modal-title">Verifica tu Email</h3>
            <p class="wa-modal__text">
                Para asegurar la integridad de nuestros registros, necesitamos verificar tu email antes de contar tu
                voto/reporte.
                ¡No te preocupes, es solo un enlace de verificación único!
            </p>

            <form @submit.prevent="submit">
                <div class="wa-field" style="margin-top:24px">
                    <label for="email" class="wa-label">Dirección de Email</label>
                    <input type="email" x-model="email" id="email" required class="wa-input"
                        placeholder="tu@conservatorio.edu">
                </div>

                <div x-show="error" class="wa-error" x-text="error"></div>

                <div class="wa-modal__actions">
                    <button type="button" class="wa-btn wa-btn--ghost"
                        onclick="document.getElementById('auth-modal').outerHTML = '<div id=\'auth-modal\'></div>'">
                        Cancelar
                    </button>
                    <button type="submit" :disabled="isLoading" class="wa-btn wa-btn--primary">
                        <span x-show="!isLoading">Enviar Enlace Mágico</span>
                        <span x-show="isLoading">Enviando...</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Success State -->
        <div x-show="sent" x-cloak>
            <h3 class="wa-modal__title">¡Enlace Mágico Enviado!</h3>
            <p class="wa-modal__text">
                Por favor revisa tu email <strong><span x-text="email"></span></strong>.
            </p>
            <div class="wa-modal__actions">
                <button onclick="document.getElementById('auth-modal').outerHTML = '<div id=\'auth-modal\'></div>'"
                    type="button" class="wa-btn wa-btn--ghost">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
