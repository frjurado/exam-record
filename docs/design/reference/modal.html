<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiAnálisis — Modal & form reference</title>
<link rel="stylesheet" href="../../../app/static/css/wikianalisis.css">
</head>
<body>
<div class="wa-modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
<div class="wa-modal__backdrop"></div>
<div class="wa-modal__panel">
<h3 id="m-title" class="wa-modal__title">Completar voto</h3>
<p class="wa-modal__text">Has iniciado sesión correctamente. ¿Quieres confirmar tu voto para esta obra?</p>
<div class="wa-field" style="margin-top:24px"><label class="wa-label" for="email">Correo electrónico</label><input id="email" class="wa-input" type="email" placeholder="tu@correo.com"><span class="wa-hint">Te enviaremos un enlace de acceso.</span></div>
<div class="wa-modal__actions"><button class="wa-btn wa-btn--ghost" type="button">Cancelar</button><button class="wa-btn wa-btn--primary" type="button">Confirmar voto</button></div>
</div>
</div>
</body>
</html>
